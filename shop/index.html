<head>

<title>Quick Phones Uganda</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#f5f7fb;
}


header{
background:#2563eb;
color:white;
padding:15px;
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
}


.logo{
font-size:25px;
font-weight:bold;
}


.search{
width:45%;
padding:12px;
border:0;
border-radius:5px;
}


nav{
background:white;
padding:15px;
display:flex;
gap:10px;
overflow:auto;
}.categories button{
min-width:120px;
border-radius:25px;
font-weight:bold;
}


.slider{
position:relative;
height:350px;
margin:15px;
border-radius:15px;
overflow:hidden;
}

.slide{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:none;

background-repeat:no-repeat;
background-position:center;
background-size:contain; /* Use contain for product cutouts */
background-color:#ffff; /* Blue fills the empty space */

padding:60px 20px;
text-align:center;
color:white;
}

.slide.active{
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.slide::before{
content:"";
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.25);
}

.slide h1,
.slide p,
.slide button,
.slide-buy{
position:relative;
z-index:2;
}

.slide-buy{
display:inline-block;
background:#25D366;
color:white;
padding:10px 22px;
border-radius:25px;
font-weight:bold;
text-decoration:none;
margin-top:10px;
}


.dots{

text-align:center;
padding:10px;

}


.dot{

height:10px;
width:10px;
background:#ccc;
border-radius:50%;
display:inline-block;
margin:5px;

}


.dot.active{

background:#2563eb;

}


button{
background:#2563eb;
color:white;
border:0;
padding:12px;
border-radius:5px;
cursor:pointer;
}


.banner{

background:#2563eb;
color:white;
padding:40px 20px;
text-align:center;

}


.container{

padding:20px;

}


.products{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;

}


.card{

background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 8px #ddd;
position:relative;

}


.card img{

width:100%;
height:220px;
object-fit:contain;
background:white;

}

.card-desc{
font-size:13px;
color:#555;
margin:6px 0 10px 0;
min-height:32px;
}


.price{

font-size:22px;
font-weight:bold;
color:#ff6600;

}


.loan-badge{

position:absolute;
top:10px;
left:10px;
background:#25D366;
color:white;
padding:5px 10px;
border-radius:5px;
font-size:12px;

}


.order{

background:#25D366;
width:100%;
margin-top:10px;

}


.loan{

background:white;
margin:20px;
padding:20px;
border-radius:10px;

}


.loan input,.loan select{

padding:12px;
margin:5px;
width:30%;

}


footer{

background:#222;
color:white;
padding:30px;
text-align:center;

}



@media(max-width:600px){

header{
flex-direction:column;
}

.search{
width:100%;
}


.loan input,.loan select{
width:100%;
}

}


</style>

function display(data){


let box=document.getElementById("products");

box.innerHTML="";


data.forEach(phone=>{


box.innerHTML+=`

<div class="card">


<div class="loan-badge">
Loan Available
</div>


<img loading="lazy" src="${phone.image}">


<h3>
${phone.name}
</h3>


<p>
${phone.brand}
</p>


<p class="price">
UGX ${phone.price.toLocaleString()}
</p>


<button class="order"
onclick="order('${phone.name}',${phone.price})">

🟢 Order WhatsApp

</button>


</div>


`;


});


}





function order(name,price){


let message=

`Hello Quick Phones 👋

I want to buy:

${name}

Price:
UGX ${price.toLocaleString()}

Please help me complete my order.`;


window.open(

"https://wa.me/"+whatsapp+
"?text="+
encodeURIComponent(message)

);


}





function filterBrand(brand){


if(brand=="All"){

display(phones);

}else{


display(

phones.filter(
p=>p.brand==brand
)

);


}


}





function searchPhone(){


let text=
document.getElementById("search")
.value.toLowerCase();



display(

phones.filter(

p=>

p.name.toLowerCase().includes(text)
||
p.brand.toLowerCase().includes(text)

)

);


}






function calculateLoan(){


let phonePrice=
Number(price.value);


let dep=
Number(deposit.value);


let monthsNumber=
Number(months.value);



let balance=
phonePrice-dep;


let monthly=
balance/monthsNumber;



result.innerHTML=

`
Balance:
UGX ${balance.toLocaleString()}

<br>

Monthly:
UGX ${monthly.toLocaleString()}

`;



}

let slideIndex=0;

let slides=document.querySelectorAll(".slide");
let dots=document.querySelectorAll(".dot");


function changeSlide(){

slides.forEach(s=>s.classList.remove("active"));
dots.forEach(d=>d.classList.remove("active"));


slideIndex++;

if(slideIndex>=slides.length){
slideIndex=0;
}


slides[slideIndex].classList.add("active");
dots[slideIndex].classList.add("active");


}


setInterval(changeSlide,4000);



display(phones);


</script>
